name: Agent - CI Fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: agent-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  ci-fix:
    runs-on: ubuntu-latest
    # Only reacts to failed CI runs on agent-owned branches. The one-attempt
    # limit (status:ci-fix-attempted) is enforced inside ci-fix.md by the
    # agent itself, since PR labels aren't available on the workflow_run
    # payload without an extra API call the agent can make directly.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CIFIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIFIX_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/agents/_shared-guardrails.md
            echo ""
            cat .github/agents/ci-fix.md
            echo ""
            echo "## Triggering context"
            echo "Repo: ${{ github.repository }}"
            echo "Failing branch: ${{ github.event.workflow_run.head_branch }}"
            echo "Failing run: ${{ github.event.workflow_run.id }}"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # allowed_bots: "*" — the triggering actor here is whichever bot pushed
      # the commit that failed CI (data or backend).
      # permission-mode bypassPermissions: required for headless CI — see
      # agent-review.yml for why.
      - uses: anthropics/claude-code-action@v1
        id: claude
        # A turn-limit stall is an expected outcome for a hard task, not a
        # workflow failure — the "Gate on Claude result" step below re-raises
        # any *other* failure.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "*"
          bot_name: "vetretire-ci-fix[bot]"
          bot_id: "314732286"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: "--max-turns 30 --permission-mode bypassPermissions"

      # Tolerate ONLY a max-turns stall (result subtype error_max_turns); any
      # other Claude failure still fails the job.
      - name: Gate on Claude result
        if: always() && steps.claude.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          subtype=""
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            if [ -z "$subtype" ] && grep -q 'error_max_turns' "$EXECUTION_FILE" 2>/dev/null; then
              subtype="error_max_turns"
            fi
          fi
          echo "Claude result subtype: '${subtype:-unknown}'"
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::notice::CI-fix agent hit the turn limit without finishing — treated as a soft stall, not a failure."
            exit 0
          fi
          echo "::error::Claude Code failed for a non-max-turns reason (subtype: '${subtype:-unknown}')."
          exit 1
