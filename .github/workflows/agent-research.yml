name: Agent - Research

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: agent-research-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.issue.labels.*.name, 'status:blocked') && (
        (github.event_name == 'issues' && github.event.label.name == 'agent:research') ||
        (github.event_name == 'issue_comment' &&
         startsWith(github.event.comment.body, '/agent-research') &&
         contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association))
      )
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RESEARCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RESEARCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Build prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/agents/_shared-guardrails.md
            echo ""
            cat .github/agents/research.md
            echo ""
            echo "## Triggering issue"
            echo "Repo: ${{ github.repository }}"
            echo "Issue: #${{ github.event.issue.number }}"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # allowed_bots: "*" is safe here specifically because none of the 5 role
      # apps hold the Workflows permission (see .github/agents/_shared-guardrails.md),
      # the label/branch conditions above already scope who can trigger this job,
      # and a public commenter cannot forge a bot actor without repo-admin access.
      # permission-mode bypassPermissions: required for headless CI (see
      # agent-review.yml for why). RESEARCH_APP's Contents: read-only
      # permission is the real backstop against a push; disallowedTools
      # additionally blocks file edits, since research only ever reports
      # findings via gh issue comment/label, never touches files.
      - uses: anthropics/claude-code-action@v1
        id: claude
        # A turn-limit stall is an expected outcome for a hard task, not a
        # workflow failure — the "Gate on Claude result" step below re-raises
        # any *other* failure.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "*"
          bot_name: "vetretire-research[bot]"
          bot_id: "314729928"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: "--max-turns 50 --permission-mode bypassPermissions --disallowedTools Edit,Write"

      # Tolerate ONLY a max-turns stall (result subtype error_max_turns); any
      # other Claude failure still fails the job.
      - name: Gate on Claude result
        if: always() && steps.claude.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          subtype=""
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            if [ -z "$subtype" ] && grep -q 'error_max_turns' "$EXECUTION_FILE" 2>/dev/null; then
              subtype="error_max_turns"
            fi
          fi
          echo "Claude result subtype: '${subtype:-unknown}'"
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::notice::Research agent hit the turn limit without finishing — treated as a soft stall, not a failure."
            exit 0
          fi
          echo "::error::Claude Code failed for a non-max-turns reason (subtype: '${subtype:-unknown}')."
          exit 1
