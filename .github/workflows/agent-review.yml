name: Agent - Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Only ever reviews PRs the agent pipeline itself opened — never a PR the
    # human opens for their own reasons. Both conditions must hold: the
    # agent-pr label AND the agent/** branch prefix, so this can't be spoofed
    # by a human applying the label to their own PR out of curiosity.
    if: >
      !contains(github.event.pull_request.labels.*.name, 'status:blocked') &&
      contains(github.event.pull_request.labels.*.name, 'agent-pr') &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Build prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/agents/_shared-guardrails.md
            echo ""
            cat .github/agents/review.md
            echo ""
            echo "## Triggering context"
            echo "Repo: ${{ github.repository }}"
            echo "PR: #${{ github.event.pull_request.number }}"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # allowed_bots: "*" — the data/backend bots open these PRs, so the
      # triggering actor on "opened"/"synchronize" is always one of them.
      # permission-mode bypassPermissions: required for any headless CI run —
      # with no human to answer Claude Code's own tool-approval prompts, every
      # Bash/tool call would otherwise hang as a denial and burn turns for
      # nothing (this is exactly what happened in the first smoke test run).
      # The real safety boundary here is the REVIEW_APP's own GitHub
      # permissions (Contents: read-only), which makes a push structurally
      # impossible regardless of local permission mode. disallowedTools
      # additionally blocks file edits outright, since this role should only
      # ever comment/review, never modify files.
      - uses: anthropics/claude-code-action@v1
        id: claude
        # A turn-limit stall is an expected outcome for a hard task, not a
        # workflow failure — the "Gate on Claude result" step below re-raises
        # any *other* failure.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "*"
          bot_name: "vetretire-reviewer[bot]"
          bot_id: "314730973"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: "--max-turns 30 --permission-mode bypassPermissions --disallowedTools Edit,Write"

      # Tolerate ONLY a max-turns stall (result subtype error_max_turns); any
      # other Claude failure still fails the job.
      - name: Gate on Claude result
        if: always() && steps.claude.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          subtype=""
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            if [ -z "$subtype" ] && grep -q 'error_max_turns' "$EXECUTION_FILE" 2>/dev/null; then
              subtype="error_max_turns"
            fi
          fi
          echo "Claude result subtype: '${subtype:-unknown}'"
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::notice::Review agent hit the turn limit without finishing — treated as a soft stall, not a failure."
            exit 0
          fi
          echo "::error::Claude Code failed for a non-max-turns reason (subtype: '${subtype:-unknown}')."
          exit 1
