name: Agent - Data

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: agent-data-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    # Two label paths, matching the handoff mechanics in
    # .github/agents/_shared-guardrails.md:
    #   1. issues/labeled "agent:data" — initial handoff from research (or a human).
    #   2. pull_request/labeled "agent:data" — the "changes requested" round-trip
    #      from review.md, which relabels the PR (not the issue) back to this role.
    #      GitHub treats issue-label and PR-label events as distinct types even
    #      though PRs/issues share label state, so both triggers are required.
    if: >
      !contains(github.event.issue.labels.*.name, 'status:blocked') &&
      !contains(github.event.pull_request.labels.*.name, 'status:blocked') && (
        (github.event_name == 'issues' && github.event.label.name == 'agent:data') ||
        (github.event_name == 'pull_request' && github.event.label.name == 'agent:data') ||
        (github.event_name == 'issue_comment' &&
         startsWith(github.event.comment.body, '/agent-data') &&
         contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association))
      )
    environment: data-agent
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      # The repo's data scripts are invoked as `node --env-file=.env ...` (see
      # CLAUDE.md) — they read a physical .env file, not just process env vars.
      # Write one here so the documented script invocations work unmodified.
      - name: Write .env
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

      - name: Build prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/agents/_shared-guardrails.md
            echo ""
            cat .github/agents/data.md
            echo ""
            echo "## Triggering context"
            echo "Repo: ${{ github.repository }}"
            echo "Issue: #${{ github.event.issue.number }}"
            echo "PR: #${{ github.event.pull_request.number }}"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # allowed_bots: "*" — see agent-research.yml for the reasoning; the review
      # bot is the other identity expected to trigger this job via the PR-labeled path.
      # permission-mode bypassPermissions: required for headless CI (see
      # agent-review.yml). This role needs full Edit/Write/Bash to run data
      # scripts and commit, so nothing is disallowed here — the real backstop
      # is DATA_APP's GitHub permissions plus the shared-guardrails refusal
      # instructions, not the local permission mode.
      - uses: anthropics/claude-code-action@v1
        id: claude
        # A turn-limit stall is an expected outcome for a hard/ambiguous data
        # task, not a workflow failure — the agent comments/hands off and a
        # human or the next role picks it up. Don't hard-fail the job here; the
        # "Gate on Claude result" step below re-raises any *other* failure.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "*"
          bot_name: "vetretire-data[bot]"
          bot_id: "314730346"
          branch_prefix: "agent/data/"
          base_branch: master
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: "--max-turns 100 --permission-mode bypassPermissions"

      # Tolerate ONLY a max-turns stall (result subtype error_max_turns); any
      # other Claude failure still fails the job. Requires the step above to set
      # continue-on-error so we can inspect its outcome.
      - name: Gate on Claude result
        if: always() && steps.claude.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          subtype=""
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            if [ -z "$subtype" ] && grep -q 'error_max_turns' "$EXECUTION_FILE" 2>/dev/null; then
              subtype="error_max_turns"
            fi
          fi
          echo "Claude result subtype: '${subtype:-unknown}'"
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::notice::Data agent hit the turn limit without finishing — treated as a soft stall, not a failure."
            exit 0
          fi
          echo "::error::Claude Code failed for a non-max-turns reason (subtype: '${subtype:-unknown}')."
          exit 1
