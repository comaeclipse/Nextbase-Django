name: Defense jobs refresh

# No DATABASE_URL in collection. Merge its PR to trigger serial Apply.
# Enable Monday collection with DEFENSE_JOBS_SCHEDULE_ENABLED=true.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Open a snapshot PR (false = collect and retain artifacts only)"
        type: boolean
        default: false
      employers:
        description: "Optional comma-separated employer slugs; blank collects all boards"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: defense-jobs-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.DEFENSE_JOBS_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CAPTURE: data/defense-job-refresh/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect complete boards without database access
        id: collect
        timeout-minutes: 280
        continue-on-error: true
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_UA: ${{ secrets.USAJOBS_UA }}
          EMPLOYERS: ${{ inputs.employers }}
        run: |
          set -euo pipefail
          args=(collect --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ -n "$EMPLOYERS" ]; then args+=(--employers "$EMPLOYERS"); fi
          node node_modules/tsx/dist/cli.mjs scripts/refresh-defense-jobs.ts "${args[@]}" 2>&1 | tee .check_collect.log
      # Mint after the potentially multi-hour pull: app tokens last 1 hour.
      - uses: actions/create-github-app-token@v2
        id: app
        if: (github.event_name == 'schedule' || inputs.publish) && hashFiles(format('{0}/manifest.json', env.CAPTURE)) != ''
        with:
          app-id: ${{ secrets.DATA_APP_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the reviewable snapshot PR
        if: steps.app.outcome == 'success' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="codex/defense-jobs-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "defense-jobs-refresh[bot]"
          git config user.email "defense-jobs-refresh[bot]@users.noreply.github.com"
          git add "$CAPTURE/manifest.json"
          find "$CAPTURE" -maxdepth 1 -name '*.csv' -print0 | xargs -0 -r git add --
          git commit -m "Collect defense job snapshots for review"
          git push -u origin "$branch"
          {
            echo "Collected snapshots only; no production DB writes. Merge triggers serial Apply of the checksummed snapshots."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat .check_defense-refresh-report.md
            echo "Part of #366. Failed/empty/manual/unconfigured boards have no apply snapshot."
          } > .check_pr_body.md
          gh pr create --repo "$REPO" --base master --head "$branch" --title "Defense jobs refresh: ${GITHUB_RUN_ID}" --body-file .check_pr_body.md
      - name: Publish per-employer report
        if: always()
        run: |
          if [ -f .check_defense-refresh-report.md ]; then cat .check_defense-refresh-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defense-job-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/defense-job-refresh/${{ github.run_id }}-${{ github.run_attempt }}/
            .check_collect.log
            .check_defense-refresh-report.md
          include-hidden-files: true
          retention-days: 30
      - name: Fail visibly when any board failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection incomplete. Successful boards may have a review PR; inspect failed and skipped employers in the artifact."
          exit 1
